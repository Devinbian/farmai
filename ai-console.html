<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI控制台 - FarmAI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ai-console.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="ai-console-container">
        <!-- 左侧导航栏 -->
        <div class="ai-sidebar">
            <div class="ai-logo">
                <button class="sidebar-toggle-btn">
                    <i class="ri-menu-fold-line"></i>
                </button>
                <img src="images/speaking.png" alt="FarmAI Logo">
                <span>AI控制台</span>
            </div>
            <nav class="ai-nav">
                <!-- AI创作菜单 -->
                <div class="nav-group">
                    <div class="nav-group-title">
                        <i class="ri-magic-line"></i>
                        <span>AI创作</span>
                        <i class="ri-arrow-down-s-line dropdown-icon"></i>
                    </div>
                    <div class="nav-submenu">
                        <a href="#chat" class="active">
                            <i class="ri-chat-3-line"></i>
                            <span>AI对话</span>
                        </a>
                        <a href="#image">
                            <i class="ri-image-2-line"></i>
                            <span>AI绘画</span>
                        </a>
                        <a href="#video">
                            <i class="ri-video-line"></i>
                            <span>AI视频</span>
                        </a>
                    </div>
                </div>
                
                <!-- 我的资产菜单 -->
                <div class="nav-group">
                    <div class="nav-group-title">
                        <i class="ri-folder-2-line"></i>
                        <span>我的资产</span>
                        <i class="ri-arrow-down-s-line dropdown-icon"></i>
                    </div>
                    <div class="nav-submenu">
                        <a href="#files">
                            <i class="ri-file-list-line"></i>
                            <span>素材管理</span>
                        </a>
                        <a href="#favorites">
                            <i class="ri-star-line"></i>
                            <span>我的收藏</span>
                        </a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- 主要内容区域 -->
        <div class="ai-main-content">
            <!-- AI对话区域 -->
            <section id="chat" class="ai-section active">
                <div class="chat-container">
                    <!-- 左侧对话列表 -->
                    <div class="chat-sidebar">
                        <div class="chat-header-actions">
                            <button class="new-chat-btn">
                                <i class="ri-add-line"></i>
                                <span>新对话</span>
                            </button>
                            <button class="history-toggle-btn">
                                <i class="ri-arrow-right-s-line"></i>
                            </button>
                        </div>
                        <div class="chat-history">
                            <div class="history-list" id="chatHistoryList">
                                <!-- 历史对话列表将通过JavaScript动态添加 -->
                            </div>
                        </div>
                    </div>
                    <!-- 右侧聊天区域 -->
                    <div class="chat-main">
                        <div class="chat-header">
                            <div class="chat-title" id="currentChatTitle">新对话</div>
                            <div class="chat-actions">
                                <button class="action-btn" title="重命名对话">
                                    <i class="ri-edit-line"></i>
                                </button>
                                <button class="action-btn" title="清空对话">
                                    <i class="ri-delete-bin-line"></i>
                                </button>
                                <button class="action-btn" title="导出对话">
                                    <i class="ri-download-line"></i>
                                </button>
                            </div>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <!-- 消息内容将通过JavaScript动态添加 -->
                        </div>
                        <div class="chat-input-container">
                            <textarea id="chatInput" placeholder="输入您的问题..." rows="1"></textarea>
                            <button id="sendMessage" class="send-btn">
                                <i class="ri-send-plane-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- AI绘画区域 -->
            <section id="image" class="ai-section">
                <div class="image-generation-container">
                    <!-- 左侧创意描述区域 -->
                    <div class="image-creation-area">
                        <!-- 顶部创意描述卡片 -->
                        <div class="creation-card">
                            <div class="card-header">
                                <i class="ri-lightbulb-line"></i>
                                <span>创意描述</span>
                            </div>
                            <div class="card-content">
                                <div class="prompt-input">
                                    <textarea id="imagePrompt" placeholder="请描述您想生成的图片内容，或查看使用指南提升生成效果" rows="3"></textarea>
                                </div>
                                <div class="prompt-suggestions">
                                    <div class="tag-list">
                                        <span class="tag">控火术</span>
                                        <span class="tag">情绪负担</span>
                                        <span class="tag">青年写真</span>
                                        <span class="tag">背光大片</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 中间参考图卡片 -->
                        <div class="creation-card">
                            <div class="card-header">
                                <div class="header-left">
                                    <i class="ri-image-line"></i>
                                    <span>上传参考图</span>
                                </div>
                                <div class="header-right">
                                    <span class="tip-text">(非必填)</span>
                                </div>
                            </div>
                            <div class="card-content">
                                <div class="upload-area" id="uploadArea">
                                    <div class="upload-icon">
                                        <i class="ri-upload-2-line"></i>
                                    </div>
                                    <div class="upload-text">
                                        <p>点击/拖拽</p>
                                    </div>
                                    <div class="upload-tip">支持jpg/png格式</div>
                                </div>
                            </div>
                        </div>

                        <!-- 底部参数设置卡片 -->
                        <div class="creation-card">
                            <div class="card-header">
                                <i class="ri-settings-3-line"></i>
                                <span>参数设置</span>
                            </div>
                            <div class="card-content">
                                <div class="param-group">
                                    <div class="param-label">图片比例</div>
                                    <div class="ratio-options">
                                        <button class="ratio-btn active" data-ratio="1:1">1:1</button>
                                        <button class="ratio-btn" data-ratio="16:9">16:9</button>
                                        <button class="ratio-btn" data-ratio="9:16">9:16</button>
                                        <button class="ratio-btn" data-ratio="4:3">4:3</button>
                                    </div>
                                </div>
                                <div class="param-group">
                                    <div class="param-label">生成数量</div>
                                    <div class="number-input">
                                        <button class="number-btn minus">-</button>
                                        <input type="number" id="generateCount" value="1" min="1" max="4">
                                        <button class="number-btn plus">+</button>
                                    </div>
                                </div>
                                <button id="generateImage" class="primary-btn">
                                    <i class="ri-magic-line"></i>
                                    立即生成
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 中间预览区域 -->
                    <div class="image-preview-container">
                        <div class="preview-area" id="imagePreview">
                            <!-- 空状态 -->
                            <div class="empty-preview">
                                <i class="ri-image-2-line"></i>
                                <p>快去生成你的创意吧~</p>
                            </div>
                            
                            <!-- 图片预览网格 -->
                            <div class="preview-grid" data-count="4" style="display: none;">
                                <!-- 生成中的图片项 -->
                                <div class="preview-item generating">
                                    <div class="loading-spinner"></div>
                                    <span class="generating-text">图像生成中...</span>
                                </div>
                                
                                <!-- 已生成的图片项 -->
                                <div class="preview-item">
                                    <img src="https://imgapi.cn/api.php?zd=mobile&fl=meizi&gs=images" alt="生成的图片">
                                    <div class="image-actions">
                                        <button class="image-action-btn" title="收藏">
                                            <i class="ri-heart-line"></i>
                                        </button>
                                        <button class="image-action-btn" title="下载">
                                            <i class="ri-download-line"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="preview-footer">
                            <p>内容由人工智能模型生成，不代表平台的观点，立场或态度，请合理使用和参考</p>
                        </div>
                    </div>

                    <!-- 右侧历史记录 -->
                    <div class="image-history collapsed">
                        <!-- 展开/收起按钮 -->
                        <button class="toggle-btn" title="展开/收起">
                            <i class="ri-arrow-left-s-line"></i>
                        </button>
                        <div class="history-header">
                            <div class="header-left">
                                <span>历史</span>
                            </div>
                            <div class="header-right">
                                <div class="view-toggle">
                                    <button class="view-btn active" data-view="tree" title="层级视图">
                                        <i class="ri-list-check-2"></i>
                                        <span>层级</span>
                                    </button>
                                    <button class="view-btn" data-view="grid" title="平铺视图">
                                        <i class="ri-grid-line"></i>
                                        <span>平铺</span>
                                    </button>
                                </div>
                                <button class="batch-btn">
                                    <i class="ri-file-copy-line"></i>
                                    <span>批量</span>
                                </button>
                            </div>
                        </div>
                        <div class="history-content">
                            <!-- 层级视图 -->
                            <div class="history-list tree-view" id="treeViewList">
                                <!-- 层级视图下的图片组 -->
                                <div class="history-group">
                                    <img src="https://imgapi.cn/api.php?zd=mobile&fl=meizi&gs=images" alt="组预览图片">
                                    <div class="image-actions">
                                        <button class="image-action-btn" title="收藏">
                                            <i class="ri-heart-line"></i>
                                        </button>
                                    </div>
                                    <div class="image-count">9张</div>
                                </div>
                                
                                <!-- 默认空状态 -->
                                <div class="history-empty-state">
                                    <div class="empty-icon">
                                        <i class="ri-image-add-line"></i>
                                    </div>
                                    <p class="empty-text">生成图片后</p>
                                    <p class="empty-text">将在这里显示</p>
                                </div>
                            </div>

                            <!-- 平铺视图 -->
                            <div class="history-list grid-view" id="gridViewList" style="display: none;">
                                <!-- 平铺视图下的图片卡片 -->
                                <div class="history-item">
                                    <img src="https://imgapi.cn/api.php?zd=mobile&fl=meizi&gs=images" alt="生成图片">
                                    <div class="image-actions">
                                        <button class="image-action-btn" title="收藏" onclick="handleFavorite(this)">
                                            <i class="ri-heart-line"></i>
                                        </button>
                                    </div>
                                    <div class="image-tags">
                                        <span class="image-tag">风景</span>
                                    </div>
                                </div>
                                <!-- 默认空状态 -->
                                <div class="history-empty-state">
                                    <div class="empty-icon">
                                        <i class="ri-image-add-line"></i>
                                    </div>
                                    <p class="empty-text">生成图片后</p>
                                    <p class="empty-text">将在这里显示</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- AI视频区域 -->
            <section id="video" class="ai-section">
                <div class="video-generation-container">
                    <div class="prompt-input">
                        <textarea id="videoPrompt" placeholder="描述您想要生成的视频..." rows="3"></textarea>
                        <div class="video-options">
                            <select id="videoStyle">
                                <option value="realistic">写实风格</option>
                                <option value="anime">动漫风格</option>
                                <option value="documentary">纪录片风格</option>
                            </select>
                            <button id="generateVideo" class="primary-btn">生成视频</button>
                        </div>
                    </div>
                    <div class="video-preview" id="videoPreview">
                        <!-- 视频预览区域 -->
                    </div>
                </div>
            </section>

            <!-- 文件管理区域 -->
            <section id="files" class="ai-section">
                <div class="files-container">
                    <div class="section-header">
                        <h2>文件管理</h2>
                        <p>管理您的AI创作文件</p>
                    </div>
                    <div class="files-content">
                        <div class="empty-state">
                            <i class="ri-file-list-3-line"></i>
                            <p>暂无文件</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 我的收藏区域 -->
            <section id="favorites" class="ai-section">
                <div class="favorites-container">
                    <div class="section-header">
                        <h2>我的收藏</h2>
                        <p>您收藏的AI创作内容</p>
                    </div>
                    <div class="favorites-content">
                        <div class="empty-state">
                            <i class="ri-star-line"></i>
                            <p>暂无收藏内容</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 重命名对话框 -->
    <div class="dialog-overlay" id="renameDialogOverlay" style="display: none;">
        <div class="rename-dialog">
            <h3>重命名对话</h3>
            <input type="text" id="renameInput" placeholder="输入新的对话名称">
            <div class="dialog-actions">
                <button class="dialog-btn cancel-btn" id="cancelRename">取消</button>
                <button class="dialog-btn confirm-btn" id="confirmRename">确定</button>
            </div>
        </div>
    </div>

    <script src="js/ai-console.js"></script>
</body>
</html>
