<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>用户登录 - 智慧微农场Smart Mini-farm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(to bottom, #e8f5e9, #c8e6c9, #a5d6a7, #81c784);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .login-header {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        
        .login-header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 500;
        }
        
        .login-header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .login-form {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group .material-icons {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 20px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            border-color: #27ae60;
            box-shadow: 0 0 0 2px rgba(39, 174, 96, 0.2);
            outline: none;
        }
        
        .role-selector {
            display: flex;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .role-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            background: #f5f5f5;
            color: #666;
        }
        
        .role-option.active {
            background: #27ae60;
            color: white;
        }
        
        .role-option:not(:last-child) {
            border-right: 1px solid #ddd;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        
        .login-btn:hover {
            background: linear-gradient(to right, #219653, #27ae60);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
        
        .form-footer a {
            color: #27ae60;
            text-decoration: none;
            font-weight: 500;
        }
        
        .form-footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-me input {
            margin-right: 8px;
        }
        
        .remember-me label {
            font-size: 14px;
            color: #666;
            margin-bottom: 0;
        }
        
        .forgot-password {
            text-align: right;
            font-size: 14px;
        }
        
        .forgot-password a {
            color: #27ae60;
            text-decoration: none;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .login-container {
                box-shadow: none;
            }
            
            .login-form {
                padding: 20px;
            }
        }
    </style>
    <!-- 先加载配置 -->
    <script type="module">
        import { config } from './js/config.js';
        // 将 config 设置为全局变量
        window.siteConfig = config;
    </script>
</head>
<body>

    <main class="main-content">
        <div class="login-container">
            <div class="login-header">
                <h1>智慧微农场 - 用户登录</h1>
                <p>欢迎回来，请登录您的账号</p>
            </div>
            
            <div class="login-form">
                <div class="role-selector">
                    <div class="role-option" data-role="student">学生</div>
                    <div class="role-option" data-role="teacher">老师</div>
                    <div class="role-option" data-role="admin">管理员</div>
                </div>
                
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-group">
                        <span class="material-icons">person</span>
                        <input type="text" id="username" class="form-control" placeholder="请输入用户名">
                    </div>
                    <div class="error-message" id="username-error"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-group">
                        <span class="material-icons">lock</span>
                        <input type="password" id="password" class="form-control" placeholder="请输入密码">
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">记住我</label>
                </div>
                
                <button type="button" class="login-btn" id="login-btn">登录</button>
                
                <div class="success-message" id="login-success"></div>
                <div class="error-message" id="login-error"></div>
                
                <div class="form-footer">
                    <p>没有账号？请联系管理员创建账号</p>
                    <div class="forgot-password">
                        <a href="#">忘记密码？</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        // 使用全局变量 window.siteConfig
        
        // 导入和初始化头部和底部组件
        import { createHeader, updateNavTitle, initializeNavbar } from './components/layout/header.js';
        import { createFooter } from './components/layout/footer.js';
        
        document.getElementById('header').innerHTML = createHeader();
        document.getElementById('footer').innerHTML = createFooter();
        
        updateNavTitle('用户登录');
        initializeNavbar();
    </script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 角色选择
            const roleOptions = document.querySelectorAll('.role-option');
            let selectedRole = 'student'; // 默认选择学生角色
            
            roleOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // 移除所有active类
                    roleOptions.forEach(opt => opt.classList.remove('active'));
                    // 添加active类到当前选中的选项
                    this.classList.add('active');
                    // 更新选中的角色
                    selectedRole = this.dataset.role;
                });
            });
            
            // 默认选中学生角色
            document.querySelector('.role-option[data-role="student"]').classList.add('active');
            
            // 登录按钮点击事件
            const loginBtn = document.getElementById('login-btn');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const loginError = document.getElementById('login-error');
            const loginSuccess = document.getElementById('login-success');
            
            loginBtn.addEventListener('click', function() {
                // 重置错误信息
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                loginError.style.display = 'none';
                loginSuccess.style.display = 'none';
                
                // 获取输入值
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                
                // 简单验证
                let isValid = true;
                
                if (!username) {
                    usernameError.textContent = '请输入用户名';
                    usernameError.style.display = 'block';
                    isValid = false;
                }
                
                if (!password) {
                    passwordError.textContent = '请输入密码';
                    passwordError.style.display = 'block';
                    isValid = false;
                }
                
                if (!isValid) return;
                
                // 模拟登录验证
                // 在实际应用中，这里应该是一个AJAX请求到后端验证
                
                // 模拟的用户数据
                const users = {
                    admin: { username: 'admin', password: 'admin123', role: 'admin' },
                    teacher: { username: 'teacher', password: 'teacher123', role: 'teacher' },
                    student: { username: 'student', password: 'student123', role: 'student' }
                };
                
                // 检查用户名和密码是否匹配
                let isAuthenticated = false;
                let authenticatedRole = '';
                
                for (const key in users) {
                    const user = users[key];
                    if (user.username === username && user.password === password) {
                        isAuthenticated = true;
                        authenticatedRole = user.role;
                        break;
                    }
                }
                
                if (isAuthenticated) {
                    // 检查角色是否匹配
                    if (authenticatedRole === selectedRole) {
                        // 登录成功
                        loginSuccess.textContent = '登录成功，正在跳转...';
                        loginSuccess.style.display = 'block';
                        
                        // 保存登录状态到localStorage
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('userRole', authenticatedRole);
                        localStorage.setItem('username', username);
                        
                        // 重定向到首页，而不是直接进入仪表盘
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        // 角色不匹配
                        loginError.textContent = '所选角色与账号不匹配，请选择正确的角色';
                        loginError.style.display = 'block';
                    }
                } else {
                    // 登录失败
                    loginError.textContent = '用户名或密码错误，请重试';
                    loginError.style.display = 'block';
                }
            });
            
            // 回车键登录
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
        });
    </script>
</body>
</html>
